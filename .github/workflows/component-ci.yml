name: component-ci

# Builds and tests the MrSpicyUI component on a real macOS/Xcode toolchain:
#  - unit tests on an iOS Simulator (xcodebuild test)
#  - device-architecture build (generic/platform=iOS, arm64/iphoneos), unsigned
#
# All logs and built artifacts are committed to the `ci/artifacts` branch
# (github.com git transport), because Actions artifact/log downloads are not
# reachable from the session sandbox. Error excerpts are also emitted as
# ::error:: annotations.
#
# This workflow deliberately does NOT attempt to modify, re-sign, or repackage
# the 8 Ball Pool application. See validation/reports/integration-validation.md.

on:
  push:
    branches:
      - arena/50b0a530-8ballspicy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  component:
    name: Build & test MrSpicyUI
    runs-on: macos-latest
    defaults:
      run:
        working-directory: MrSpicyUI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          {
            echo "### Toolchain"
            echo '```'
            sw_vers
            xcodebuild -version
            swift --version
            echo '```'
            echo "### xcodebuild -list"
            (xcodebuild -list 2>&1 || true)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" | tee toolchain.txt

      - name: Prepare iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' | tee sim-choice.txt
          import json, subprocess, sys, uuid

          def simctl(*args):
              out = subprocess.run(["xcrun", "simctl", "list", "-j", *args],
                                   capture_output=True, text=True, check=True)
              return json.loads(out.stdout)

          data = simctl("devices", "available")
          name = None
          for runtime, devices in data.get("devices", {}).items():
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      name = d["name"]
                      break
              if name:
                  break

          if name is None:
              dtypes = simctl("devicetypes")["devicetypes"]
              runtimes = simctl("runtimes")["runtimes"]
              iphone = next((d for d in reversed(dtypes) if d["name"].startswith("iPhone")), None)
              ios_rt = next((r for r in reversed(runtimes)
                             if r.get("isAvailable") and r["platform"] == "iOS"), None)
              if not iphone or not ios_rt:
                  print("::error::No iPhone device type or iOS runtime available", file=sys.stderr)
                  sys.exit(1)
              sim_name = "MrSpicySim-" + uuid.uuid4().hex[:6]
              subprocess.run(["xcrun", "simctl", "create", sim_name,
                              iphone["identifier"], ios_rt["identifier"]], check=True)
              name = sim_name

          print(f"Selected simulator: {name}")
          with open("sim.env", "w") as f:
              f.write(f"SIM_NAME={name}\n")
          PY
          echo "name=$(grep '^SIM_NAME=' sim.env | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests (iOS Simulator)
        run: |
          set +e
          set -o pipefail
          xcodebuild test \
            -scheme MrSpicyUI \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath MrSpicyUI-tests.xcresult 2>&1 | tee xcodebuild-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild test failed with exit code $status"
            grep -E "error:|BUILD FAILED|TEST FAILED|Fatal|failed" xcodebuild-test.log \
              | head -60 | sed 's/^/::error::test: /'
            echo "### test log error excerpt" >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|BUILD FAILED|TEST FAILED|Fatal|failed" xcodebuild-test.log \
              | head -60 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "test_status=$status" >> test-status.txt
          exit $status

      - name: Build for generic iOS device (unsigned)
        run: |
          set +e
          set -o pipefail
          xcodebuild build \
            -scheme MrSpicyUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-device.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild device build failed with exit code $status"
            grep -E "error:|BUILD FAILED|Fatal|failed" xcodebuild-device.log \
              | head -60 | sed 's/^/::error::dev: /'
            echo "### device build error excerpt" >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|BUILD FAILED|Fatal|failed" xcodebuild-device.log \
              | head -60 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "device_status=$status" >> test-status.txt
          exit $status

      - name: Verify produced architecture
        run: |
          set +e
          PRODUCTS=build-device/Build/Products/Release-iphoneos
          {
            echo "### Products"
            echo '```'
            find "$PRODUCTS" -type f 2>/dev/null | sed 's/^/  /'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" | tee products.txt
          status=0
          found=0
          while IFS= read -r f; do
            case "$(file -b "$f")" in
              *Mach-O*)
                found=1
                archs=$(lipo -archs "$f" 2>/dev/null || echo 'unknown')
                echo "::notice::arch: $f -> $archs"
                echo "$f -> $archs" | tee -a "$GITHUB_STEP_SUMMARY" >> products.txt
                echo "$archs" | grep -q arm64 || { echo "::error::NOT arm64: $f ($archs)"; status=1; }
                ;;
            esac
          done < <(find "$PRODUCTS" -type f 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo "::error::No Mach-O binaries produced in $PRODUCTS"
            status=1
          fi
          echo "arch_status=$status" >> test-status.txt
          exit $status

      - name: Package and hash
        if: success()
        run: |
          PRODUCTS=build-device/Build/Products/Release-iphoneos
          mkdir -p dist
          (cd "$PRODUCTS" && zip -qr ../../dist/MrSpicyUI-iphoneos-arm64-unsigned.zip .)
          shasum -a 256 dist/MrSpicyUI-iphoneos-arm64-unsigned.zip | tee dist/MrSpicyUI-iphoneos-arm64-unsigned.sha256
          cat dist/MrSpicyUI-iphoneos-arm64-unsigned.sha256 | sed 's/^/::notice::artifact sha256: /'
          cp dist/MrSpicyUI-iphoneos-arm64-unsigned.sha256 .

      - name: Publish results to ci/artifacts branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          PUBLISH_DIR="runs/${GITHUB_RUN_ID}"
          mkdir -p "$PUBLISH_DIR"
          cp MrSpicyUI/toolchain.txt MrSpicyUI/sim-choice.txt MrSpicyUI/test-status.txt "$PUBLISH_DIR/" 2>/dev/null
          cp MrSpicyUI/xcodebuild-test.log MrSpicyUI/xcodebuild-device.log "$PUBLISH_DIR/" 2>/dev/null
          cp MrSpicyUI/products.txt "$PUBLISH_DIR/" 2>/dev/null
          cp -R MrSpicyUI/dist "$PUBLISH_DIR/" 2>/dev/null
          du -sh "$PUBLISH_DIR"

          rm -rf /tmp/ci-publish
          mkdir -p /tmp/ci-publish && cd /tmp/ci-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin ci/artifacts
          if [ $? -eq 0 ]; then
            git checkout -q -b ci/artifacts origin/ci/artifacts
          else
            git checkout -q --orphan ci/artifacts
            git rm -rfq . >/dev/null 2>&1
          fi
          mkdir -p runs
          cp -R "$GITHUB_WORKSPACE/$PUBLISH_DIR" "runs/${GITHUB_RUN_ID}"
          git add -A
          git commit -q -m "ci: component-ci run ${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"
          git push -q origin ci/artifacts
          echo "::notice::Published run results to ci/artifacts branch"
